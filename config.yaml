# Configuration file for Bandcamp Parser Bot

# Schedule configuration (24-hour format)
# Every hour from 00:00 to 16:00 UTC - paused 17:00-23:00 UTC
schedule:
  times:
    - "00:00"
    - "01:00"
    - "02:00"
    - "03:00"
    - "04:00"
    - "05:00"
    - "06:00"
    - "07:00"
    - "08:00"
    - "09:00"
    - "10:00"
    - "11:00"
    - "12:00"
    - "13:00"
    - "14:00"
    - "15:00"
    - "16:00"
  timezone: "UTC"
  # Random delay (0..N minutes) added after each scheduled time, so runs
  # don't fire at a perfectly predictable :00 mark every time.
  jitter_minutes: 8

# Tags to monitor
tags:
  - "punk"
  - "hardcore"
  - "hardcore punk"
  - "raw punk"
  - "d-beat"
  - "dbeat"
  - "crust punk"
  - "hcpunk"
  - "punk rock"
  - "metalcore"
  - "egg punk"
  - "street punk"
  - "post-punk"
  - "uk82"
  - "h8000"
  - "garage punk"
  - "hc"
  

# Blacklist tags - releases from these tags will be added to DB but NOT sent to Telegram
# This prevents releases from blacklisted genres from being sent when found in other tags
# Uncomment and add tags as needed
blacklist_tags:
  - "happy hardcore"
  - "electronic"
  - "techno"

# Skip releases older than this many days (0 = no limit). Bandcamp's "new"
# feed isn't strictly chronological and sometimes surfaces older catalog
# items - this keeps those out of Telegram without disabling them from
# being found at all (still added to DB, just not sent).
max_release_age_days: 30

# Parser settings
parser:
  # Delay between requests (seconds)
  request_delay: 1.5
  # User agent for requests
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

# Telegram settings
telegram:
  # Maximum length of description in message (0 = no limit)
  max_description_length: 0

# Database settings
database:
  # Path to SQLite database file
  db_path: "bandcamp_releases.db"
  # Cleanup old records older than N days (0 = never cleanup - disabled,
  # relying on disk_usage_threshold_percent below instead)
  cleanup_days: 0
  # Emergency cleanup: once disk usage on the database's filesystem hits
  # this percent, delete the oldest records (regardless of cleanup_days)
  # until usage drops back to disk_usage_target_percent (0 = disabled)
  disk_usage_threshold_percent: 85
  disk_usage_target_percent: 75
